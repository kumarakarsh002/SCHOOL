<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Panel</title>
    <link rel="Stylesheet" href="./studentpanel.css" />
    <link rel="icon" type="image/png" href="../image/icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <section class="student-loginsection">
        <div class="student-loginsection-left">
            <img src="../image/studentpanel/Gemini_Generated_Image_y6w7fgy6w7fgy6w7.png" alt="studentloginimage"/>
        </div>
        <div id="studentlogin" class="student-loginsection-right">
            <h1>Student Login</h1>
            <form class="student-loginsection-right-form">
                <div class="student-loginsection-right-form-div">
                    <label>Name</label>
                    <input type="text" placeholder="Enter Your Name" class="student-loginsection-right-form-div-input" />
                </div>
                <div class="student-loginsection-right-form-div">
                    <label>Username</label>
                    <input type="text" placeholder="Enter Your Username" class="student-loginsection-right-form-div-input"/>
                </div>
                <div class="student-loginsection-right-form-div">
                    <label>Password</label>
                    <input type="password" placeholder="Enter Your Password" class="student-loginsection-right-form-div-input" />
                </div>
                <input type="button" value="Login" class="student-loginsection-right-form-div-button" onclick="StudentLog()"/>
            </form>
            <p>Don't have an account? <a onclick="SignUp()">Sign Up</a></p>
        </div>

        <div id="studentsignup" class="student-loginsection-right hidden">
            <h1>Student SignUp</h1>
            <form class="student-loginsection-right-form">
                <div class="student-loginsection-right-form-div">
                    <label>Name</label>
                    <input type="text" placeholder="Enter Your Name" class="student-loginsection-right-form-div-input" />
                </div>
                <div class="student-loginsection-right-form-div">
                    <label>Username</label>
                    <input type="text" placeholder="Enter Your Username" class="student-loginsection-right-form-div-input"/>
                </div>
                <div class="student-loginsection-right-form-div">
                    <label>Password</label>
                    <input type="password" placeholder="Enter Your Password" class="student-loginsection-right-form-div-input" />
                </div>
                <input type="submit" value="Submit" class="student-loginsection-right-form-div-button"/>
            </form>
            <p>Don't have an account? <a onclick="Login()">Login</a></p>
        </div>

    </section>

</body>

<script src="./studentpanel.js"></script>

</html>
