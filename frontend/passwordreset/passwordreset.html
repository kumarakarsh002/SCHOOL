<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work in Progress</title>
    <style>
        /* CSS Styles */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }

        .container {
            text-align: center;
            background-color: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            max-width: 600px;
            width: 90%;
        }

        .illustration {
            max-width: 100%;
            height: auto;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 28px;
            margin: 0;
            color: #2c3e50;
            font-weight: 600;
        }

        p {
            font-size: 16px;
            color: #7f8c8d;
            margin-top: 10px;
            margin-bottom: 0;
        }
        
        /* Adds a subtle fade-in animation */
        .container {
            animation: fadeIn 0.8s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Referencing your image verbatim -->
        <img src="../image/adminpanel/reset.png" alt="Working on it" class="illustration">
        
        <h1>We are working on it</h1>
        <p>Please check back later as we make improvements.</p>
    </div>

</body>
</html>
