<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="icon" type="image/png" href="../image/icon.png">
    <link rel="Stylesheet" href="./admindashboard.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <section class="dashboard">
        <section class="dashboard-left">
            <h1>Left Div</h1>
            <button onclick="loadpage('Dashboard', this)">
                <i class="fa-solid fa-house"></i>
                Dashboard
                <span style="margin-left: auto;"><i class="fa-solid fa-angle-right" ></i></span>
            </button>
            <button onclick="loadpage('Toppersection', this)">
                <i class="fa-solid fa-user-graduate"></i>
                Topper Section
                <span style="margin-left: auto;"><i class="fa-solid fa-angle-right" ></i></span>
            </button>
            <button onclick="loadpage('Library', this)">
                <i class="fa-solid fa-book-open"></i>
                Library
                <span style="margin-left: auto;"><i class="fa-solid fa-angle-right" ></i></span>
            </button>
            <button onclick="loadpage('CustomerSupport', this)">
                <i class="fa-solid fa-headset"></i>
                Customer & Support
                <span style="margin-left: auto;"><i class="fa-solid fa-angle-right" ></i></span>
            </button>
            <button onclick="loadpage('AdminPanel', this)">
                <i class="fa-solid fa-user-shield"></i>
                Admin Panel
                <span style="margin-left: auto;"><i class="fa-solid fa-angle-right" ></i></span>
            </button>
        </section>
        <section class="dashboard-right" id="main-content">
            <h1>Right Div</h1>
        </section>
    </section>
</body>

<script src="./admindashboard.js"></script>
</html>
