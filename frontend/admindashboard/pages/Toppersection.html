<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
    *{
        box-sizing: border-box;
    }
    body{
        font-family: 'Poppins', sans-serif;
    }
    .content{
        height: 100vh;
        overflow: scroll;
        border: 2px solid pink;
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    .Toppersection-studentdetails{
        border: 1px solid #ddd;
        border-radius: 10px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        width: 95%;
        height: 45%;
        display: flex;
    }
    .Toppersection-studentdetails-image, .Toppersection-studentdetails-image-preview{
        border: 2px dotted gold;
        border-radius: 12px;
        margin: 3% 2% 3% 2%;
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        transition: 0.3s;
        overflow: hidden;
        p{
            text-align: center;
            color: #666;
            margin-bottom: 8px;
        }
        span{
            color: #4f46e5;
        font-weight: bold;
        }
        input{
            display: none;
        }
        img{
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        

    }
    .Toppersection-studentdetails-image:hover{
        border-color: #4f46e5;
      background: #f5f3ff;
    }
    .Toppersection-studentdetails-imagedetails{
        /* border: 2px solid seagreen; */
        flex: 2;
    }
    .delete-btn {
        position: absolute;
    width: 30px;
    height: 30px;
    transform: translate(135px, -85px);
    
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    border-radius: 6px;

    background: #fff0f0;
    color: #dc2626;

    cursor: pointer;

    font-size: 15px;

    transition: 0.2s;
}

.delete-btn:hover {
    background: #dc2626;
    color: white;
}

.delete-btn i {
    pointer-events: none;
}


    .hidden{
        display: none;
    }
</style>


</head>
<body>
    <section class="content">
    <h1>Toppersection</h1>
    <section class="Toppersection-studentdetails">
        <div class="Toppersection-studentdetails-image" id="ImageDiv">
            <p>Drag & Drop your image here</p>
            <p>or <span>Browse Files</span></p>
            
         <input type="file" id="fileInput" accept="image/*" >
        </div>
        <div class="Toppersection-studentdetails-image-preview hidden" id="ImageDivPreview">
            <button class="delete-btn" id="deletebutton">
                <i class="fa-solid fa-trash"></i>
            </button>
            <img id="imagePreview" alt="Image Preview">
        </div>
        <div class="Toppersection-studentdetails-imagedetails">

        </div>
    </section>
    </section>
    
</body>
</html>
